<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Me & You — nossa história">
  <title>Me & You ♥</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

  <!-- Modal de música -->
  <div class="ct-modal-play-music" id="musicModal">
    <div class="bg-modal-play-music">
      <button class="close-music" onclick="closeModalMusic()" aria-label="Fechar">
        <i class="bi bi-x"></i>
      </button>
      <div class="modal-inner">
        <div class="modal-heart">
          <i class="bi bi-heart-fill"></i>
        </div>
        <h2>Nossa Playlist</h2>
        <p>Dê play para uma experiência mais especial.</p>
        <button id="playButton" type="button">
          <i class="bi bi-play-fill"></i>&nbsp;Play
        </button>
      </div>
    </div>
  </div>

  <!-- Conteúdo principal -->
  <div class="body-bg">
    <div class="main-content">

      <!-- Carrossel gerado dinamicamente pelo JS -->
      <div class="carousel-wrapper">
        <div class="carousel-stage">
          <div class="carousel" id="carousel"></div>
          <button class="carousel-btn carousel-btn-prev" id="prevBtn" aria-label="Anterior">
            <i class="bi bi-chevron-left"></i>
          </button>
          <button class="carousel-btn carousel-btn-next" id="nextBtn" aria-label="Próximo">
            <i class="bi bi-chevron-right"></i>
          </button>
        </div>
        <div class="carousel-footer">
          <div class="carousel-progress">
            <div class="carousel-progress-fill" id="progressFill"></div>
          </div>
          <div class="carousel-counter" id="slideCounter"></div>
        </div>
      </div>

      <!-- Cronômetro -->
      <div class="ct-timer">
        <div class="timer" id="idtimer"></div>
      </div>

    </div>
  </div>

  <!-- Player de áudio oculto -->
  <audio id="musicPlayer"></audio>

  <script src="./script/script.js"></script>

</body>
</html>
